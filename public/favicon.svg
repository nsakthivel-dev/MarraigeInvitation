<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Premium Islamic Emerald and Gold Favicon -->
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3D2E" />
      <stop offset="50%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#032B20" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D3A1" />
      <stop offset="50%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#9A7730" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5D3A1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C6A15B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Emerald Circle with Double Gold Rim -->
  <circle cx="32" cy="32" r="30" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#E5D3A1" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.8"/>
  <circle cx="32" cy="32" r="23" fill="url(#goldGlow)" />

  <!-- Crescent Moon -->
  <path d="M 36 17 C 26 17 18 25 18 35 C 18 43 24 49 32 50 C 26 47 23 41 23 35 C 23 27 28 20 36 17 Z" fill="url(#goldGrad)" />

  <!-- 8-Pointed Star (Rub el Hizb) inside Crescent -->
  <g transform="translate(37, 27) scale(0.65)">
    <rect x="-7" y="-7" width="14" height="14" fill="url(#goldGrad)" rx="1"/>
    <rect x="-7" y="-7" width="14" height="14" fill="url(#goldGrad)" transform="rotate(45)" rx="1"/>
    <circle cx="0" cy="0" r="2.5" fill="#064E3B" />
  </g>
</svg>