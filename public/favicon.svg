<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Sacred Diya / Vilakku Favicon -->
  <defs>
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="60%" stop-color="#FF9E00" />
      <stop offset="100%" stop-color="#D90429" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D388" />
      <stop offset="50%" stop-color="#B08D57" />
      <stop offset="100%" stop-color="#73522C" />
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B2635" />
      <stop offset="100%" stop-color="#541520" />
    </linearGradient>
  </defs>
  <!-- Background circular badge -->
  <circle cx="32" cy="32" r="30" fill="url(#maroonGrad)" stroke="#B08D57" stroke-width="2"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#F2D388" stroke-dasharray="2,3" stroke-width="0.8" opacity="0.8"/>
  
  <!-- Flame Glow & Flame -->
  <circle cx="32" cy="18" r="10" fill="url(#flameGlow)" opacity="0.6"/>
  <path d="M32 9 C35 15, 36 19, 34 22 C32.5 24, 31.5 24, 30 22 C28 19, 29 15, 32 9 Z" fill="#FFEAA7"/>
  <path d="M32 12 C33.5 16, 34 18, 33 20 C32.3 21, 31.7 21, 31 20 C30 18, 30.5 16, 32 12 Z" fill="#FF7675"/>

  <!-- Brass Diya Bowl -->
  <path d="M20 25 C20 33, 44 33, 44 25 C44 23, 20 23, 20 25 Z" fill="url(#goldGrad)"/>
  <ellipse cx="32" cy="24.5" rx="11" ry="2.5" fill="#FFE599"/>
  <!-- Stem & Pedestal -->
  <path d="M30 30 L30 43 L34 43 L34 30 Z" fill="url(#goldGrad)"/>
  <path d="M24 43 C24 40, 40 40, 40 43 L42 48 C42 50, 22 50, 22 48 Z" fill="url(#goldGrad)"/>
</svg>